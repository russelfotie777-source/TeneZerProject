<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hors ligne — Tenezer Immobilier</title>
<style>
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0B0B0B;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 24px;
    }
    .box { max-width: 420px; }
    img { width: 72px; height: 72px; border-radius: 16px; margin-bottom: 24px; }
    h1 { font-size: 22px; margin: 0 0 12px; }
    p { color: #a0a0a0; font-size: 14px; line-height: 1.6; margin: 0 0 28px; }
    button {
        background: #F1A80A;
        color: #0B0B0B;
        border: none;
        padding: 14px 28px;
        border-radius: 999px;
        font-weight: 800;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        cursor: pointer;
    }
</style>
</head>
<body>
    <div class="box">
        <img src="includes/icon-96.png" alt="Tenezer">
        <h1>Pas de connexion</h1>
        <p>Vous êtes hors ligne. Vérifiez votre connexion internet pour continuer à consulter les biens Tenezer.</p>
        <button onclick="window.location.reload()">Réessayer</button>
    </div>
</body>
</html>
